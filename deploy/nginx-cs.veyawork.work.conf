# VeyaCare —— cs.veyawork.work 站点配置
#
# 由 deploy/cicd-deploy.sh 幂等安装到 /etc/nginx/sites-available/ 并软链到 sites-enabled。
#
# ★ 本文件是「服务器现状的准源头」，不是只含 80 端口的手写草稿 ★
#
# 2026-09-28 用 `sudo certbot --nginx -d cs.veyawork.work` 签下证书，certbot 就地
# 改写了服务器上那份配置（拆出 80→443 的 301 段、给主 server 块补上 443 ssl 与
# 证书路径），本文件随即按服务器上的实际内容逐字节同步回来（md5 一致）。
#
# 为什么必须同步回来：部署脚本第 7 步是拿本文件与服务器上那份做 diff，不一致就
# 覆盖 + reload。若这里仍是「只有 80 端口」的旧版，下次 push 会把 certbot 写的
# 整个 HTTPS 段冲掉，站点静默退回纯 HTTP。
#
# 带 `# managed by Certbot` 的行由 certbot 维护，续期时会再改；改动前先想清楚。
# 证书路径 /etc/letsencrypt/live/cs.veyawork.work/ 是签完证书才存在的，
# 所以本文件只适用于已经签过证书的机器（本项目单机部署，够用）。
#
# 架构：nginx 同时扮演两个角色
#   /            → 直接吐 frontend/dist 里的静态文件（前端构建产物，不占常驻内存）
#   /api/**      → 反代到 127.0.0.1:3002 的 uvicorn
# 前端 VITE_API_BASE 留空时走相对路径 /api/**，所以同源部署天然没有跨域问题。

server {
    server_name cs.veyawork.work;

    root /opt/veyacare/frontend/dist;
    index index.html;

    # 访问日志单独一份，排查时不用在别的站点日志里翻
    access_log /var/log/nginx/veyacare.access.log;
    error_log  /var/log/nginx/veyacare.error.log;

    # gzip：前端产物是 173.7 kB 的 JS，压完 56.1 kB，值得开
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 前端（SPA）----------
    location / {
        # 前端是单页应用，/sessions/xxx 这类路径在磁盘上没有对应文件，
        # 直接回 index.html 交给前端路由
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存，否则发版后用户拿到的还是旧页面、引用的旧 assets 已不存在
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3002;

        # 用 HTTP/1.1 才能走 chunked，SSE 需要
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 置空而不是 "upgrade"：这里不需要 WebSocket 升级，
        # 留着会让 nginx 把连接当成要升级处理
        proxy_set_header Connection        '';

        # ★★ 这两行是本项目能不能用的关键 ★★
        # /api/chat/stream 是 SSE 打字机输出。nginx 默认会缓冲响应体，
        # 结果是所有 token 攒在缓冲里、最后一次性吐给浏览器——流式效果完全消失。
        proxy_buffering off;
        proxy_cache off;

        # 转人工场景下这条连接可能挂着等很久，默认 60s 会被掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cs.veyawork.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cs.veyawork.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = cs.veyawork.work) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name cs.veyawork.work;
    return 404; # managed by Certbot


}