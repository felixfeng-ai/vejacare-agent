# VeyaCare —— cs.veyawork.work 站点配置
#
# 由 deploy/cicd-deploy.sh 幂等安装到 /etc/nginx/sites-available/ 并软链到 sites-enabled。
# 只写 80 端口这一段；HTTPS 由 certbot 追加（DNS 解析生效后跑一次即可）：
#   sudo certbot --nginx -d cs.veyawork.work
#
# 架构：nginx 同时扮演两个角色
#   /            → 直接吐 frontend/dist 里的静态文件（前端构建产物，不占常驻内存）
#   /api/**      → 反代到 127.0.0.1:3002 的 uvicorn
# 前端 VITE_API_BASE 留空时走相对路径 /api/**，所以同源部署天然没有跨域问题。

server {
    listen 80;
    listen [::]:80;
    server_name cs.veyawork.work;

    root /opt/veyacare/frontend/dist;
    index index.html;

    # 访问日志单独一份，排查时不用在别的站点日志里翻
    access_log /var/log/nginx/veyacare.access.log;
    error_log  /var/log/nginx/veyacare.error.log;

    # gzip：前端产物是 173.7 kB 的 JS，压完 56.1 kB，值得开
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 前端（SPA）----------
    location / {
        # 前端是单页应用，/sessions/xxx 这类路径在磁盘上没有对应文件，
        # 直接回 index.html 交给前端路由
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存，否则发版后用户拿到的还是旧页面、引用的旧 assets 已不存在
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3002;

        # 用 HTTP/1.1 才能走 chunked，SSE 需要
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 置空而不是 "upgrade"：这里不需要 WebSocket 升级，
        # 留着会让 nginx 把连接当成要升级处理
        proxy_set_header Connection        '';

        # ★★ 这两行是本项目能不能用的关键 ★★
        # /api/chat/stream 是 SSE 打字机输出。nginx 默认会缓冲响应体，
        # 结果是所有 token 攒在缓冲里、最后一次性吐给浏览器——流式效果完全消失。
        proxy_buffering off;
        proxy_cache off;

        # 转人工场景下这条连接可能挂着等很久，默认 60s 会被掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
