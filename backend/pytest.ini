[pytest]
testpaths = tests
asyncio_mode = auto
; conftest 的 _prepared_app 是 session 作用域的异步 fixture，且全图/checkpointer
; 是 session 单例，其 aiosqlite 连接绑定在创建它的事件循环上。fixture 与测试
; 必须共用同一个 session 级 loop，否则 pytest-asyncio 抛 ScopeMismatch，
; 或跨 loop 复用连接导致偶发报错。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
