[pytest]
; 放在仓库根而不是 backend/ 下：配置若只存在于 backend/，从仓库根直接敲
; `pytest` 时它就找不到，asyncio 那两行失效 —— 异步 fixture 与测试会落到
; 不同的事件循环上，图与 checkpointer 的 aiosqlite 连接跨 loop 复用，
; 转人工 resume 随即失效。表现是 51 条里 23 条报错，而代码其实一行没坏。
; 提到根目录后 `pytest`（仓库根）和 `cd backend && pytest` 两种跑法都对。
testpaths = backend/tests

asyncio_mode = auto
; conftest 的 _prepared_app 是 session 作用域的异步 fixture，且全图/checkpointer
; 是 session 单例，其 aiosqlite 连接绑定在创建它的事件循环上。fixture 与测试
; 必须共用同一个 session 级 loop，否则 pytest-asyncio 抛 ScopeMismatch，
; 或跨 loop 复用连接导致偶发报错。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

addopts = -q --tb=short

filterwarnings =
    ignore::DeprecationWarning
